[tool.black]
line-length = 79

[project]
name = "dicom-to-video"
authors = [
    {name = "Jean-Pierre Chauvel", email = "jean.p.chauvel@gmail.com"},
]
license = {text = "CC0"}
version = "0.1.0"
description = "DICOM sequential medical images to AVI video"
requires-python = "<3.15,>=3.14"
dependencies = [
    "matplotlib>=3.10.7",
    "opencv-python>=4.12.0.88",
    "pydicom>=3.0.1",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
]
